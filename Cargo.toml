[package]
authors = ["Robin Grell <robin@simular.ai>"]
edition = "2024"
license = "MIT"
name    = "simulang-log-viewer"
publish = false
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[[bin]]
name              = "simulang-log-viewer"
path              = "src/bin/simulang-log-viewer.rs"
required-features = ["viewer"]

[features]
default = []
viewer = [
  "dep:eframe",
  "dep:global-hotkey",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
]

[dependencies]
napi        = "3.8.6"
napi-derive = "3.5.5"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

eframe = { version = "0.34", default-features = false, features = [
  "glow",
  "default_fonts",
  "wayland",
  "x11",
], optional = true }
global-hotkey = { version = "0.8", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
], optional = true }
objc2-foundation = { version = "0.3", optional = true }

[build-dependencies]
napi-build = "2"

[profile.release]
codegen-units = 1
lto           = "fat"
strip         = true
# Keep default panic = "unwind"; napi-rs uses catch_unwind to convert
# Rust panics into JavaScript errors. Switching to "abort" would crash
# the Node process on any panic instead of surfacing a JS exception.
