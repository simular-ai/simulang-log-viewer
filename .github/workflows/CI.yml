name: CI

env:
  DEBUG: napi:*
  APP_NAME: simulang-log-viewer
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb # v2.0.17

  # On tag pushes we build every target so the publish job has full platform coverage.
  # On every other run we only build the two primary targets to save CI time.
  targets:
    name: Pick build targets
    runs-on: ubuntu-latest
    outputs:
      settings: ${{ steps.pick.outputs.settings }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            cat <<'EOF' >> "$GITHUB_OUTPUT"
          settings<<JSON
          [
            {"host": "windows-latest",   "target": "x86_64-pc-windows-msvc"},
            {"host": "windows-11-arm",   "target": "aarch64-pc-windows-msvc"},
            {"host": "macos-latest",     "target": "aarch64-apple-darwin"},
            {"host": "macos-15-intel",   "target": "x86_64-apple-darwin"},
            {"host": "ubuntu-latest",    "target": "x86_64-unknown-linux-gnu"},
            {"host": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu"}
          ]
          JSON
          EOF
          else
            cat <<'EOF' >> "$GITHUB_OUTPUT"
          settings<<JSON
          [
            {"host": "windows-latest",  "target": "x86_64-pc-windows-msvc"},
            {"host": "macos-latest",    "target": "aarch64-apple-darwin"},
            {"host": "ubuntu-latest",   "target": "x86_64-unknown-linux-gnu"}
          ]
          JSON
          EOF
          fi

  build:
    name: Build ${{ matrix.settings.target }}
    needs: targets
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.targets.outputs.settings) }}

    steps:
      # Setup
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/.gitconfig-blank # Create a blank gitconfig file in the temp directory. Ensures local gitconfig is not used.

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master on 2026-03-27
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libssl-dev
      - name: Install dependencies
        run: npm ci

      # Lint
      - name: Oxlint
        run: npm run lint -- --deny-warnings
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --features viewer --bin simulang-log-viewer

      # Build
      - name: Build (path-remapped)
        shell: bash
        run: |
          # Scrub absolute paths from release binaries so file!() locations
          # don't leak runner/workspace filesystem details.
          remap() {
            [[ "$RUNNER_OS" == "Windows" ]] && cygpath -w "$1" || printf '%s' "$1"
          }
          CARGO_HOME_PATH="$(remap "${CARGO_HOME:-$HOME/.cargo}")"
          WORKSPACE_PATH="$(remap "$GITHUB_WORKSPACE")"
          export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=${CARGO_HOME_PATH}=/cargo --remap-path-prefix=${WORKSPACE_PATH}=/workspace"
          npm run build

      - name: Strip release symbols (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Belt-and-suspenders: Cargo's `strip = true` is supposed to
          # remove non-global symbols but has historically left them in
          # place for napi cdylib builds.
          shopt -s nullglob
          for f in "${APP_NAME}".*.node; do
            echo "Stripping $f"
            strip -x "$f"
          done

      # Typecheck
      - name: Typecheck
        run: npm run typecheck

      # Upload Artifacts (only needed for publish, which runs on tags)
      # Bundling the .node file and the viewer executable in the same artifact
      # lets the publish job's `npm run artifacts` find both without a second
      # download round trip — `scripts/distribute-viewer.mjs` looks for the
      # exe alongside its sibling .node in `artifacts/<bundle>/`.
      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            ${{ env.APP_NAME }}.*.node
            ${{ env.APP_NAME }}
            ${{ env.APP_NAME }}.exe
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/.gitconfig-blank # Create a blank gitconfig file in the temp directory. Ensures local gitconfig is not used.
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Intentionally no registry-url/scope: setup-node would otherwise
          # write a scoped registry with a ${NODE_AUTH_TOKEN} placeholder into
          # ~/.npmrc. npm lifecycle scripts do not reliably preserve that token
          # for napi's child `npm publish` calls, so the publish step writes
          # the registry auth line explicitly below.
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: create npm dirs
        run: npx napi create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Move artifacts (.node + viewer binary)
        run: npm run artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_NAME#v}"
          if echo "$TAG_VERSION" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$"; then
            DIST_TAG="latest"
          elif echo "$TAG_VERSION" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+-.+"; then
            DIST_TAG="next"
          else
            echo "Not a release, skipping publish"
            exit 0
          fi

          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          NAPI_PREPUBLISH_FLAGS="--no-gh-release" \
            npm publish --registry=https://registry.npmjs.org/ --access public --tag "$DIST_TAG"
